name: Build Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile dylib for iOS
        run: |
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 -framework Foundation bypassEnti.m -o bypassEnti.dylib

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bypassEnti-dylib
          path: bypassEnti.dylib
